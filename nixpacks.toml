[providers]
providers = ["php"]

[phases.setup]
aptPkgs = [
  "php8.3",
  "php8.3-cli",
  "php8.3-common",
  "php8.3-curl",
  "php8.3-mbstring",
  "php8.3-xml",
  "php8.3-zip",
  "php8.3-gd",
  "php8.3-mysql",
  "php8.3-pdo",
  "php8.3-bcmath",
  "php8.3-fileinfo",
  "php8.3-tokenizer",
  "php8.3-imap",
  "php8.3-intl",
  "php8.3-opcache",
  "php8.3-calendar",
  "composer",
  "unzip"
]

[phases.build]
cmds = [
  "composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-reqs",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
